<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financial Fraud Detection</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<nav class="navbar navbar-dark bg-dark shadow">
    <div class="container">
        <span class="navbar-brand mb-0 h1">
            💳 Financial Fraud Detection System
        </span>
    </div>
</nav>

<div class="container py-5">

<div class="row justify-content-center">

<div class="col-lg-8">

<div class="glass-card">

<h2 class="text-center mb-4">
🔍 Transaction Details
</h2>

<form action="/predict" method="POST">

<div class="row">

<div class="col-md-6 mb-3">
<label>Step</label>
<input type="number" class="form-control" name="step" required>
</div>

<div class="col-md-6 mb-3">
<label>Transaction Type</label>

<select class="form-select" name="type">

<option>PAYMENT</option>
<option>TRANSFER</option>
<option>CASH_OUT</option>
<option>DEBIT</option>
<option>CASH_IN</option>

</select>

</div>

<div class="col-md-6 mb-3">
<label>Amount</label>
<input type="number" class="form-control" step="0.01" name="amount" required>
</div>

<div class="col-md-6 mb-3">
<label>Old Balance Origin</label>
<input type="number" class="form-control" step="0.01" name="oldbalanceOrg" required>
</div>

<div class="col-md-6 mb-3">
<label>New Balance Origin</label>
<input type="number" class="form-control" step="0.01" name="newbalanceOrig" required>
</div>

<div class="col-md-6 mb-3">
<label>Old Balance Destination</label>
<input type="number" class="form-control" step="0.01" name="oldbalanceDest" required>
</div>

<div class="col-12 mb-4">
<label>New Balance Destination</label>
<input type="number" class="form-control" step="0.01" name="newbalanceDest" required>
</div>

<div class="text-center">

<button class="btn btn-primary btn-lg px-5">

🚀 Predict Fraud

</button>

</div>

</form>

{% if prediction %}

<div class="mt-5">

{% if "Fraud" in prediction %}

<div class="alert alert-danger text-center">

<h3>{{ prediction }}</h3>

<hr>

<h5>

Confidence :

<b>{{ confidence }}%</b>

</h5>

</div>

{% else %}

<div class="alert alert-success text-center">

<h3>{{ prediction }}</h3>

</div>

{% endif %}

</div>

{% endif %}

</div>

</div>

</div>

</div>

<footer class="text-center text-white mt-5 mb-3">

Developed by <b>Riddhi Thakkar</b><br>

Financial Fraud Detection using Machine Learning

</footer>

</body>
</html>
